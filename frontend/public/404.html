<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ForensIQ — Redirecting...</title>
    <script>
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        var fullUrl = path + search + hash;
        try {
          sessionStorage.setItem('forensiq_redirect', fullUrl);
        } catch (e) {}
        window.location.replace('/?_p=' + encodeURIComponent(fullUrl));
      })();
    </script>
    <meta http-equiv="refresh" content="0;URL='/'" />
    <style>
      body {
        margin: 0;
        background-color: #020617;
        color: #94a3b8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(99, 102, 241, 0.2);
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div style="text-align: center;">
      <div class="spinner"></div>
      <p style="font-size: 14px; letter-spacing: 0.05em;">Loading ForensIQ...</p>
    </div>
  </body>
</html>
