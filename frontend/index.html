<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/forensiq.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ForensIQ — AI-powered forensic fraud investigation platform with graph analysis, anomaly detection, and chain-of-custody reporting." />
    <meta name="theme-color" content="#4F46E5" />
    <title>ForensIQ — Forensic Investigation Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      (function() {
        var redirect = null;
        try {
          redirect = sessionStorage.getItem('forensiq_redirect');
          if (redirect) {
            sessionStorage.removeItem('forensiq_redirect');
          }
        } catch (e) {}
        if (!redirect) {
          var params = new URLSearchParams(window.location.search);
          var p = params.get('_p');
          if (p) {
            redirect = decodeURIComponent(p);
          }
        }
        if (redirect && redirect !== window.location.pathname) {
          window.history.replaceState(null, null, redirect);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
