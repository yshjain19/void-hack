version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: forensiq_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forensiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forensiq_secret}
      POSTGRES_DB: ${POSTGRES_DB:-forensiq_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forensiq}"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: forensiq_neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-forensiq_neo4j}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forensiq_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forensiq}:${POSTGRES_PASSWORD:-forensiq_secret}@postgres:5432/${POSTGRES_DB:-forensiq_db}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-forensiq_neo4j}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      SECRET_KEY: ${SECRET_KEY:-change_me_in_production_32_chars_min}
      UPLOAD_DIR: /app/uploads
      REPORTS_DIR: /app/reports
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
      - reports_data:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: forensiq_frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  uploads_data:
  reports_data:
